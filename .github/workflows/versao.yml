# A cada push na main: confere o site e sobe a versão num commit próprio.
# A Vercel publica em produção só esse commit de versão (ver vercel.json),
# então um push que falha na conferência não chega ao site.
# Commits feitos com GITHUB_TOKEN não disparam workflows, por isso não há repetição.
name: Versão

on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes seguidos esperam na fila, para duas versões não disputarem a main.
concurrency:
  group: versao-main
  cancel-in-progress: false

jobs:
  versao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit

      - name: Conferir a página gerada
        run: |
          npx next start -p 3100 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3100 && break
            sleep 1
          done
          node scripts/verificar-pagina.mjs http://localhost:3100

      - name: Subir a versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): %s"
          git push origin main --follow-tags
